spring.application.name=animeverse-backend

# Load DB credentials from the repo-root .env file (the same one Docker Compose uses).
# "optional:" means the app still starts if the file is missing (e.g. on AWS, where real env vars are used).
spring.config.import=optional:file:../.env[.properties]

# --- Database connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- JPA / Hibernate ---
# Flyway owns the schema. Hibernate only checks that our Java entities match the tables; it never changes them.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a DB session open while rendering the HTTP response (avoids hidden extra queries).
spring.jpa.open-in-view=false

# --- AniList ---
animeverse.anilist.url=https://graphql.anilist.co

# --- Sync job ---
# Tests turn this off (src/test/resources/config/application.properties) so they never call AniList.
animeverse.sync.enabled=true
# Delay between the END of one sync and the start of the next (ISO-8601 duration: PT3H = 3 hours).
animeverse.sync.interval=PT3H
